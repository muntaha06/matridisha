<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregnancy Assistant</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdf2f8; margin: 0; padding: 0; }
        .main-wrapper { max-width: 800px; margin: 20px auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; height: 90vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%); padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.5em; }
        .btn-header { background: rgba(255,255,255,0.3); border: none; padding: 8px 15px; border-radius: 20px; color: white; cursor: pointer; font-weight: bold; margin-left: 10px; }
        .chat-area { flex: 1; overflow-y: auto; padding: 20px; background: #fff; scroll-behavior: smooth; }
        .message { margin-bottom: 20px; display: flex; flex-direction: column; max-width: 85%; }
        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.bot { align-self: flex-start; align-items: flex-start; }
        .bubble { padding: 15px; border-radius: 15px; line-height: 1.6; word-wrap: break-word; font-size: 1.05em; }
        .user .bubble { background: #FF9A9E; color: white; border-bottom-right-radius: 2px; text-align: left; }
        .bot .bubble { background: #f0f2f5; color: #333; border-bottom-left-radius: 2px; border: 1px solid #e1e4e8; }
        .input-area { padding: 20px; background: #f9f9f9; border-top: 1px solid #eee; display: flex; gap: 10px; flex-direction: column; }
        .input-row { display: flex; gap: 10px; }
        .input-box { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 1em; }
        .btn-send { background: #FF9A9E; border: none; padding: 10px 25px; border-radius: 25px; color: white; cursor: pointer; font-weight: bold; }
        .img-preview { max-width: 200px; border-radius: 10px; margin-bottom: 8px; display: block; border: 2px solid #FF9A9E; }
        .topic-blue { color: #2196F3; font-weight: 700; font-size: 1.1em; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .modal { background: white; width: 90%; max-width: 400px; margin: 50px auto; border-radius: 15px; padding: 20px; max-height: 80vh; overflow-y: auto; position: relative; }
        .session-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
        .session-item:hover { background: #fff0f5; }
        .close-btn { position: absolute; right: 15px; top: 15px; cursor: pointer; font-size: 24px; color: #666; font-weight: bold; width: 30px; height: 30px; line-height: 30px; text-align: center; }
        .close-btn:hover { color: #000; background: #eee; border-radius: 50%; }
        .new-chat-btn { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 10px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="header">
            <div>
                <button class="btn-header" onclick="location.href='dashboard.html'" style="margin-left: 0; margin-right: 15px;">← Back</button>
                <h1 style="display:inline-block; vertical-align:middle;">🤰 Pregnancy Assistant</h1>
            </div>
            <button class="btn-header" onclick="openHistory()">📜 History</button>
        </div>
        <div class="chat-area" id="chatBox">
            <div class="message bot"><div class="bubble">আসসালামু আলাইকুম আপু, আমি তোমাকে কীভাবে সাহায্য করতে পারি?</div></div>
        </div>
        <div class="input-area">
            <div id="previewArea"></div>
            <div class="input-row">
                <button class="btn-send" onclick="document.getElementById('fileIn').click()">📷</button>
                <input type="file" id="fileIn" hidden accept="image/*" onchange="handleFile(this)">
                <input type="text" class="input-box" id="msgIn" placeholder="Type here..." onkeypress="if(event.key==='Enter') send()">
                <button class="btn-send" id="sendBtn" onclick="send()">➤</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalLayer">
        <div class="modal">
            <div class="close-btn" onclick="closeHistory()">&times;</div>
            <h2 style="margin-top:0">Conversations</h2>
            <button class="new-chat-btn" onclick="startNewChat()">+ New Conversation</button>
            <div id="sessionList">Loading...</div>
        </div>
    </div>
    <script>
        let currentSessionId = localStorage.getItem('preg_sess_id') || '';
        let currentImageBase64 = null;
        function handleFile(input) {
            if(input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    currentImageBase64 = e.target.result;
                    document.getElementById('previewArea').innerHTML = '<img src="'+currentImageBase64+'" class="img-preview">';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        async function send() {
            let txt = document.getElementById('msgIn').value.trim();
            if(!txt && !currentImageBase64) return;
            addBubble(txt, 'user', currentImageBase64, false);
            let payload = { question: txt, sessionId: currentSessionId };
            let url = '/api/ask';
            if(currentImageBase64) {
                payload.image = currentImageBase64;
                url = '/api/upload';
            }
            document.getElementById('msgIn').value = '';
            document.getElementById('previewArea').innerHTML = '';
            let savedImg = currentImageBase64;
            currentImageBase64 = null;
            document.getElementById('fileIn').value = '';
            document.getElementById('sendBtn').disabled = true;
            let loadId = addBubble('Thinking...', 'bot', null, false);
            try {
                let res = await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                let data = await res.json();
                currentSessionId = data.sessionId;
                localStorage.setItem('preg_sess_id', currentSessionId);
                document.getElementById(loadId).remove();
                addBubble(data.answer, 'bot', null, true);
            } catch(e) {
                document.getElementById(loadId).innerText = 'Error: ' + e;
            }
            document.getElementById('sendBtn').disabled = false;
        }
        function formatResponse(text) {
            if(!text) return '';
            let pro = text.replace(/\*\*\*(.*?)\*\*\*/g, '<span class="topic-blue">$1</span>');
            pro = pro.replace(/\*/g, '');
            pro = pro.replace(/\n/g, '<br>');
            return pro;
        }
        function addBubble(html, sender, imgData, doTyping) {
            let div = document.createElement('div');
            div.className = 'message ' + sender;
            div.id = 'msg-' + Date.now() + Math.random();
            let imgHtml = imgData ? '<img src="'+imgData+'" class="img-preview"><br>' : '';
            let contentHtml = '';
            if(doTyping && sender === 'bot') {
                contentHtml = '<span class="typing-content"></span>';
            } else {
                contentHtml = html;
            }
            div.innerHTML = '<div class="bubble">' + imgHtml + contentHtml + '</div>';
            document.getElementById('chatBox').appendChild(div);
            document.getElementById('chatBox').scrollTop = 100000;
            if(doTyping && sender === 'bot') {
                typeWriter(html, div.querySelector('.typing-content'));
            }
            return div.id;
        }
        async function typeWriter(text, el) {
            let parts = text.split(/(\*{3}.*?\*{3})/g);
            for(let part of parts) {
                if(!part) continue;
                let isBold = part.startsWith('***') && part.endsWith('***');
                let content = isBold ? part.substring(3, part.length-3) : part;
                let targetSpan = null;
                if(isBold) {
                    targetSpan = document.createElement('span');
                    targetSpan.className = 'topic-blue';
                    el.appendChild(targetSpan);
                } else {
                    targetSpan = el;
                }
                await typeText(content, targetSpan);
            }
        }
        function typeText(str, el) {
            return new Promise(resolve => {
                let i = 0;
                function type() {
                    if(i < str.length) {
                        if(str[i] === '\n') el.innerHTML += '<br>';
                        else el.innerHTML += str[i];
                        i++;
                        document.getElementById('chatBox').scrollTop = 100000;
                        setTimeout(type, 20);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }
        async function openHistory() {
            document.getElementById('modalLayer').style.display = 'block';
            let res = await fetch('/api/history');
            let list = await res.json();
            let html = '';
            list.reverse().forEach(s => {
                html += `<div class="session-item" onclick="loadSession('${s.id}')">
                            <div><b>${s.title}</b></div>
                            <div class="session-date">${s.timestamp}</div>
                         </div>`;
            });
            document.getElementById('sessionList').innerHTML = html || 'No history.';
        }
        function closeHistory() {
            document.getElementById('modalLayer').style.display = 'none';
        }
        function startNewChat() {
            currentSessionId = '';
            localStorage.removeItem('preg_sess_id');
            document.getElementById('chatBox').innerHTML = '<div class="message bot"><div class="bubble">আসসালামু আলাইকুম আপু, আমি তোমাকে কীভাবে সাহায্য করতে পারি?</div></div>';
            closeHistory();
        }
        async function loadSession(id) {
            currentSessionId = id;
            localStorage.setItem('preg_sess_id', id);
            let res = await fetch('/api/history?id=' + id);
            let msgs = await res.json();
            document.getElementById('chatBox').innerHTML = '';
            msgs.forEach(m => {
                let img = m.image || null;
                if(m.user || img) addBubble(m.user, 'user', img, false);
                if(m.bot) addBubble(formatResponse(m.bot), 'bot', null, false);
            });
            closeHistory();
        }
    </script>
</body>
</html>
