<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>মাতৃ দিশা | ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Dashboard-er jonno kichu extra styling */
        .dashboard-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .menu-item {
            background: #d6336c;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }
        .menu-item:hover {
            background: #c2255c;
        }
        .logout-btn {
            background: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-container" style="width: 450px;">
        <h1>মাতৃ দিশা</h1>
        <p class="subtitle">আপনার মাতৃত্বকালীন সঙ্গী</p>

        <div class="dashboard-card">
            <h3>স্বাগতম, <span id="userDisplayName">ব্যবহারকারী</span>!</h3>
            <p>আপনার বর্তমান সপ্তাহ: <strong id="userWeeks">--</strong></p>
        </div>

        <div class="menu-grid">
            <a href="#" class="menu-item" onclick="alert('খাদ্য ও ব্যায়াম গাইড শীঘ্রই আসছে!')">দিক নির্দেশনা</a>
            <a href="#" class="menu-item" onclick="alert('AI চ্যাটবক্স কাজ করছে...')">চ্যাটবক্স</a>
            <a href="#" class="menu-item" onclick="alert('সাধারণ রোগ ও সমাধান তালিকা')">টিপস</a>
            <a href="login.html" class="menu-item logout-btn">লগ আউট</a>
        </div>
    </div>

    <script>
        // Dashboard open hole jate user-er nam dekhay (Login logic-er sathe connect hobe)
        window.onload = function() {
            // LocalStorage theke nam neyar chesta korbe
            const name = localStorage.getItem('userName') || 'ব্যবহারকারী';
            const weeks = localStorage.getItem('userWeeks') || '০';
            
            document.getElementById('userDisplayName').innerText = name;
            document.getElementById('userWeeks').innerText = weeks + " সপ্তাহ";
        };
    </script>
</body>
</html>
