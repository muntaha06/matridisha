<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>মাতৃ দিশা | রেজিস্ট্রেশন</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="login-container">
        <h1>মাতৃ দিশা</h1>
        <p class="subtitle">নতুন একাউন্ট তৈরি করুন</p>

        <form id="registrationForm">
            <label for="name">নাম</label>
            <input type="text" id="name" name="name" required>

            <label for="age">বয়স</label>
            <input type="number" id="age" name="age" required>

            <label for="weight">ওজন (কেজি)</label>
            <input type="number" step="0.1" id="weight" name="weight" required>

            <label for="weeks">গর্ভকালীন সপ্তাহ</label>
            <input type="number" id="weeks" name="weeks" required>

            <label>পূর্বে সন্তান আছে কি?</label>
            <select id="previousChild" name="previousChild">
                <option value="no">না</option>
                <option value="yes">হ্যাঁ</option>
            </select>

            <label>ডেলিভারির ধরন</label>
            <select id="deliveryType" name="deliveryType">
                <option value="n/a">প্রযোজ্য নয়</option>
                <option value="csection">সি-সেকশন</option>
                <option value="normal">নরমাল ডেলিভারি</option>
            </select>

            <label for="username">ইউজারনেম</label>
            <input type="text" id="username" name="username" required>

            <label for="password">পাসওয়ার্ড</label>
            <input type="password" id="password" name="password" required>

            <button type="button" onclick="submitRegistration()">রেজিস্ট্রেশন</button>
        </form>

        <p class="register-link">
            আগে থেকেই একাউন্ট আছে? <a href="login.html">লগইন করুন</a>
        </p>
    </div>

    <script>
        function submitRegistration() {
            const form = document.getElementById('registrationForm');
            const formData = new URLSearchParams(new FormData(form));

            fetch('../../register', { // Ei path-ta Servlet-er mapping onujayi
                method: 'POST',
                body: formData,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            })
            .then(response => {
                if (response.ok) {
                    alert("✅ রেজিস্ট্রেশন সফল হয়েছে!");
                    window.location.href = "login.html";
                } else {
                    alert("❌ রেজিস্ট্রেশন ব্যর্থ হয়েছে। আবার চেষ্টা করুন।");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("সার্ভারে সমস্যা হচ্ছে!");
            });
        }
    </script>
</body>
</html>
