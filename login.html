<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>মাতৃ দিশা | লগইন</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="login-container">
        <h1>মাতৃ দিশা</h1>
        <p class="subtitle">স্বাগতম! লগইন করুন</p>

        <form id="loginForm">
            <label for="username">ইউজারনেম</label>
            <input type="text" id="username" name="username" required>

            <label for="password">পাসওয়ার্ড</label>
            <input type="password" id="password" name="password" required>

            <button type="button" onclick="submitLogin()">লগইন</button>
        </form>

        <p class="register-link">
            নতুন ব্যবহারকারী? <a href="registration.html">একাউন্ট তৈরি করুন</a>
        </p>
    </div>

    <script>
        async function submitLogin() {
            const form = document.getElementById('loginForm');
            const formData = new URLSearchParams(new FormData(form));

            try {
                // Sending request to LoginServlet
                const response = await fetch('../../login', { 
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });

                if (response.ok) {
                    const result = await response.text();
                    const data = result.split(","); // Splitting name and weeks
                    
                    // Storing user info in browser memory for dashboard use
                    localStorage.setItem('userName', data[0]);
                    localStorage.setItem('userWeeks', data[1]);
                    
                    // Redirecting to dashboard
                    window.location.href = "dashboard.html";
                } else {
                    alert("❌ ভুল ইউজারনেম বা পাসওয়ার্ড!");
                }
            } catch (error) {
                console.error('Error:', error);
                alert("সার্ভারে সমস্যা হচ্ছে। পুনরায় চেষ্টা করুন।");
            }
        }
    </script>
</body>
</html>
