<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>মাতৃ দিশা - রেজিস্ট্রেশন</title>
</head>
<body>
    <div class="container">
        <h1>মাতৃ দিশা</h1>
        <form action="/register" method="POST">
            <div class="input-group">
                <label>আপনার পূর্ণ নাম:</label>
                <input type="text" name="name" required oninvalid="this.setCustomValidity('দয়া করে আপনার নাম লিখুন')" oninput="this.setCustomValidity('')">
            </div>
            <div class="input-group">
                <label>আপনার বয়স:</label>
                <input type="number" name="age" required oninvalid="this.setCustomValidity('আপনার বয়স সংখ্যায় লিখুন')" oninput="this.setCustomValidity('')">
            </div>
            <div class="input-group">
                <label>বর্তমান ওজন (কেজি):</label>
                <input type="number" step="0.1" name="weight" required oninvalid="this.setCustomValidity('ওজন লিখুন')" oninput="this.setCustomValidity('')">
            </div>
            <div class="input-group">
                <label>গর্ভধারণের সপ্তাহ:</label>
                <input type="number" name="weeks" required oninvalid="this.setCustomValidity('সপ্তাহ সংখ্যায় লিখুন')" oninput="this.setCustomValidity('')">
            </div>
            <div class="input-group">
                <label>আগে সন্তান হয়েছে কি?</label>
                <select name="prev_child">
                    <option value="না">না</option>
                    <option value="হ্যাঁ">হ্যাঁ</option>
                </select>
            </div>
            <div class="input-group">
                <label>ডেলিভারির ধরণ (যদি থাকে):</label>
                <select name="delivery_type">
                    <option value="প্রযোজ্য নয়">প্রযোজ্য নয়</option>
                    <option value="নরমাল">নরমাল</option>
                    <option value="সি-সেকশন">সি-সেকশন</option>
                </select>
            </div>
            <div class="input-group">
                <label>বর্তমান শারীরিক সমস্যা:</label>
                <select name="medical_issue">
                    <option value="কোন সমস্যা নেই">কোন সমস্যা নেই</option>
                    <option value="ডায়াবেটিস">ডায়াবেটিস</option>
                    <option value="উচ্চ রক্তচাপ">উচ্চ রক্তচাপ</option>
                    <option value="রক্তস্বল্পতা">রক্তস্বল্পতা</option>
                    <option value="হাঁপানি">হাঁপানি</option>
                    <option value="থাইরয়েড">থাইরয়েড</option>
                    <option value="হৃদরোগ">হৃদরোগ</option>
                </select>
            </div>
            <div class="input-group">
                <label>ইউজারনেম সেট করুন:</label>
                <input type="text" name="username" required oninvalid="this.setCustomValidity('ইউজারনেম দিন')" oninput="this.setCustomValidity('')">
            </div>
            <div class="input-group">
                <label>পাসওয়ার্ড সেট করুন:</label>
                <input type="password" name="password" required oninvalid="this.setCustomValidity('পাসওয়ার্ড দিন')" oninput="this.setCustomValidity('')">
            </div>
            <button type="submit" class="btn">রেজিস্ট্রেশন সম্পন্ন করুন</button>
        </form>
    </div>
</body>
</html>
