<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>শিশুর যত্ন - মাতৃদিশা</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    /* বাড়তি স্টাইল যাতে কার্ডগুলো দেখতে সুন্দর লাগে */
    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      .feature-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="app-page">
  <main class="center-wrap">
    <section class="center-card content-card">

      <header class="page-head">
        <h1 class="brand-title big-title">মাতৃদিশা</h1>
        <p class="page-subtitle">শিশুর দৈনন্দিন যত্ন ও বিকাশ—সহজ গাইড</p>
      </header>

      <section class="tab-content active">
        <div class="feature-grid">
          
          <a class="feature-card" href="baby-diet.html">
            <div class="feature-icon">🥣</div>
            <div>
              <h3>খাদ্য পরিকল্পনা</h3>
              <p>০ মাস থেকে ১ বছর পর্যন্ত খাবারের তালিকা</p>
            </div>
          </a>

          <a class="feature-card" href="baby-care.html">
            <div class="feature-icon">🧼</div>
            <div>
              <h3>যত্ন ও পরিচর্যা</h3>
              <p>ঘুম, পরিচ্ছন্নতা ও নিরাপত্তা টিপস</p>
            </div>
          </a>
          
        </div>
      </section>

      <div class="soft-divider"></div>

      <div class="bottom-cta two-btn">
        <a class="ghost-btn" href="index.html">← হোম</a>
        <a class="cta-btn" href="ma.html">মায়ের যত্ন →</a>
      </div>

    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
